<!-- =======================================================
     FILE: footer.html
     PURPOSE:
       Shared footer component for the Rising Tide website and
       the Northwest Ohio Visibility Alliance (NOVA). Provides
       consistent branding, contact information, and links to
       key governance documents.

     DESCRIPTION:
       This file is the single source of truth for the site
       footer: links to the Rising Tide bylaws and Code of
       Conduct, along with the shared contact email used by both
       Rising Tide and NOVA. It is not linked directly by any
       page. build.js reads this file and inlines the
       <footer>...</footer> markup into every top-level page
       between FOOTER:START/FOOTER:END marker comments.

     SUPPORTED BY:
       - build.js (reads this file and inlines it into every page —
         run `node build.js` after editing this file)

     DEPENDENCIES:
       - css/styles.css   (global site styling)
       - assets/RisingTideBylaws.pdf
       - assets/CodeofConduct.pdf

     NOTES:
       - No logic is embedded here.
       - This file contains only layout and content.
       - Editing this file has no effect on the live site until
         `node build.js` is run to regenerate every page.
       - Update documentation when footer structure or links
         change.

     VERSION:
       v1.1.0
       (Now a build-time source template for build.js instead of
       a runtime fetch() target)

     LAST UPDATED:
       2026-08-17

     AUTHOR:
       Brian Von Wert / Rising Tide
======================================================= -->
<footer>
    <div class="container">
        <p class="footer-tag">© 2026 Rising Tide Community Group — Northwest Ohio Visibility Alliance (NOVA)</p>

        <div class="footer-links">
            <div class="policy-card">
                <h3>Bylaws</h3>
                <a href="bylaws.html">Read Page</a>
            </div>
            <div class="policy-card">
                <h3>Code of Conduct</h3>
                <a href="code-of-conduct.html">Read Page</a>
            </div>
        </div>

        <p class="footer-meta">nwohiovisibility@gmail.com</p>
    </div>
</footer>
