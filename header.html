<!-- =======================================================
     FILE: header.html
     PURPOSE:
       Shared header and navigation component for the Rising
       Tide website and the Northwest Ohio Visibility Alliance
       (NOVA). Provides consistent branding, site navigation,
       and mobile-friendly menu behavior.

     DESCRIPTION:
       This file is the single source of truth for the site
       header: the Rising Tide logo, primary navigation links,
       and the hamburger menu markup used for responsive layouts.
       It is not linked directly by any page. build.js reads this
       file and inlines the <header>...</header> markup into every
       top-level page between HEADER:START/HEADER:END marker
       comments. The hamburger click behavior is bound at runtime
       by main.js.

     SUPPORTED BY:
       - build.js (reads this file and inlines it into every page —
         run `node build.js` after editing this file)
       - main.js  (binds the hamburger menu click behavior)

     DEPENDENCIES:
       - css/styles.css   (global site styling)
       - assets/logo.png  (Rising Tide logo)

     NOTES:
       - No logic is embedded here.
       - This file contains only layout and content.
       - Editing this file has no effect on the live site until
         `node build.js` is run to regenerate every page.
       - Update documentation when navigation structure or
         branding changes.

     VERSION:
       v1.7.0
       (Split the governance documents out of Who Are We into
       their own "Governance" dropdown — Meeting Records, Bylaws,
       Code of Conduct — so Who Are We stays identity-only)

     LAST UPDATED:
       2026-08-20

     AUTHOR:
       Brian Von Wert / Rising Tide
======================================================= -->

<header>

        <img src="assets/logo.png" alt="Rising Tide Logo" class="logo">

        <nav>
            <button type="button" class="hamburger" id="hamburger" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links" id="nav-links">
              <li><a href="index.html">Home</a></li>
              <li class="dropdown">
                <span class="dropdown-toggle" tabindex="0">Who Are We</span>
                <ul class="dropdown-menu">
                  <li><a href="about.html">About Us</a></li>
                  <li><a href="leadership.html">Leadership</a></li>
                </ul>
              </li>
              <li><a href="events.html">Events</a></li>
              <li class="dropdown">
                <span class="dropdown-toggle" tabindex="0">Governance</span>
                <ul class="dropdown-menu">
                  <li><a href="minutes.html">Meeting Records</a></li>
                  <li><a href="bylaws.html">Bylaws</a></li>
                  <li><a href="code-of-conduct.html">Code of Conduct</a></li>
                </ul>
              </li>
              <li class="dropdown">
                <span class="dropdown-toggle" tabindex="0">Get Involved</span>
                <ul class="dropdown-menu">
                  <li><a href="support.html">Support Us</a></li>
                  <li><a href="join.html">Join Us</a></li>
                </ul>
              </li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>
